[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jsonllm"
version = "0.1.0"
description = "A research POC for typed decisions and dependency-aware structured generation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.26,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
mlx = ["mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'", "transformers==5.17.0"]
cuda = ["torch==2.14.0", "transformers==5.17.0", "peft==0.21.0", "accelerate==1.15.0", "flash-linear-attention==0.5.2; sys_platform == 'linux'", "xgrammar==0.2.6"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[project.scripts]
jsonllm = "jsonllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonllm"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mlx: requires Apple Silicon and the mlx extra", "cuda: requires NVIDIA CUDA and the cuda extra", "tokenizer: downloads only the Qwen tokenizer"]
